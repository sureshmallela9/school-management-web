<div class="app-shell">
  <header class="topbar" *ngIf="isAuthenticated()">
    <div class="brand-wrap">
      <div class="brand-mark">SM</div>
      <div>
        <div class="brand-name">SchoolManagementUI</div>
        <small>{{ userName }}</small>
      </div>
    </div>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a *ngFor="let item of navItems" [routerLink]="item.path">{{ item.label }}</a>
      <a routerLink="/admin/tenants">Admin</a>
    </nav>

    <button class="logout-btn" type="button" (click)="logout()">Logout</button>
  </header>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" *ngIf="isAuthenticated()" aria-label="Mobile navigation">
    <a routerLink="/app/home">Home</a>
    <a routerLink="/app/students">Students</a>
    <a routerLink="/app/bus">Bus</a>
    <a routerLink="/app/attendance">Attendance</a>
    <a routerLink="/app/notifications">Notices</a>
  </nav>
</div>
