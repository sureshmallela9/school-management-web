<div class="app-shell">
  <header class="topbar" *ngIf="isAuthenticated()">
    <div class="brand-wrap">
      <div class="brand-mark" aria-label="QS">QS</div>
      <div>
        <div class="brand-name">QSchool</div>
        <small>{{ userName }}</small>
      </div>
    </div>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a
        *ngFor="let item of navItems()"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        >{{ item.label }}</a
      >
      <a
        *ngIf="isAdmin()"
        routerLink="/admin/tenants"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        >Admin</a
      >
    </nav>

    <button class="logout-btn" type="button" (click)="logout()">Logout</button>
  </header>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>

  <nav class="bottom-nav" *ngIf="isAuthenticated()" aria-label="Mobile navigation">
    <a routerLink="/app/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Home</a>
    <a
      [routerLink]="isAdmin() ? '/admin/students' : '/app/students'"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      >Students</a
    >
    <a routerLink="/app/bus" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Bus</a>
    <a
      [routerLink]="isAdmin() ? '/admin/attendance' : isTeacher() ? '/teacher/attendance/mark' : '/app/attendance'"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      >Attendance</a
    >
    <a routerLink="/app/notifications" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">Notices</a>
  </nav>
</div>
